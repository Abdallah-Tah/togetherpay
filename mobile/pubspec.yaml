name: togetherpay
description: TogetherPay Mobile - P2P bill splitting with push notifications
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0

  # Secure storage for auth tokens
  flutter_secure_storage: ^9.0.0

  # Deep linking & URL launching (wallet apps)
  url_launcher: ^6.2.2

  # Firebase (FCM/APNs push notifications)
  firebase_core: ^2.24.2
  firebase_messaging: ^14.8.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.15.5
  cloud_functions: ^4.5.6

  # Local notifications (foreground)
  flutter_local_notifications:
    path: plugins/flutter_local_notifications

  # Timezone for scheduled notifications
  timezone: ^0.9.2

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Add app icons here later
  # assets:
  #   - assets/images/
