name: togetherpay
description: TogetherPay Mobile - P2P bill splitting with push notifications
publish_to: 'none'
version: 1.0.10+23

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0

  # Date formatting
  intl: ^0.20.2

  # Push notifications
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  shared_preferences: ^2.3.2
  flutter_app_badger: ^1.5.0

  # Secure storage for auth tokens
  flutter_secure_storage: ^10.0.0

  # File handling
  path_provider: ^2.1.4
  open_filex: ^4.4.0
  path: ^1.9.0

  # Deep linking & URL launching (wallet apps)
  url_launcher: ^6.2.2
  app_links: ^6.4.1

  # UI
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^19.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  flutter_app_badger:
    path: plugins/flutter_app_badger

flutter:
  uses-material-design: true

  # Add app icons here later
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#5CCFC9"
  adaptive_icon_foreground: "assets/images/app_icon.png"
