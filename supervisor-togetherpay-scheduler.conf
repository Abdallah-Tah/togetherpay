[program:togetherpay-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while [ true ]; do (php /home/togetherpay/htdocs/www.togetherpay.app/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=togetherpay
numprocs=1
redirect_stderr=true
stdout_logfile=/home/togetherpay/htdocs/www.togetherpay.app/storage/logs/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=60
