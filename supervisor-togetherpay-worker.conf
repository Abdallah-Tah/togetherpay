[program:togetherpay-worker]
process_name=%(program_name)s_%(process_num)02d
command=php -d memory_limit=256M /home/togetherpay/htdocs/www.togetherpay.app/artisan queue:work redis --sleep=3 --tries=3 --max-time=1800 --max-jobs=1000 --timeout=60 --queue=high,default
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=togetherpay
numprocs=1
redirect_stderr=true
stdout_logfile=/home/togetherpay/htdocs/www.togetherpay.app/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
startsecs=1
startretries=3
