name: production-deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Add Flux Credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          npm ci

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        run: ./vendor/bin/pest --ci

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [security-scan, test]
    environment:
      name: Production
      url: https://api.togetherpay.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Add Flux Credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          npm ci --production

      - name: Build Assets
        run: npm run build

      - name: Create Deployment Package
        run: |
          mkdir -p deploy-package
          rsync -av --exclude='node_modules' --exclude='.git' --exclude='tests' --exclude='storage/logs' . deploy-package/
          cd deploy-package
          zip -r ../togetherpay-${{ github.sha }}.zip .

      - name: Upload to S3
        run: |
          aws s3 cp togetherpay-${{ github.sha }}.zip s3://${{ secrets.DEPLOYMENT_BUCKET }}/releases/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            
            # Configuration
            APP_DIR="/var/www/togetherpay"
            RELEASE_DIR="$APP_DIR/releases/${{ github.sha }}"
            SHARED_DIR="$APP_DIR/shared"
            
            # Create directories
            mkdir -p $RELEASE_DIR
            mkdir -p $SHARED_DIR/storage
            
            # Download and extract release
            aws s3 cp s3://${{ secrets.DEPLOYMENT_BUCKET }}/releases/togetherpay-${{ github.sha }}.zip /tmp/
            unzip -q /tmp/togetherpay-${{ github.sha }}.zip -d $RELEASE_DIR
            
            # Link shared directories
            rm -rf $RELEASE_DIR/storage
            ln -s $SHARED_DIR/storage $RELEASE_DIR/storage
            
            # Link .env file
            ln -s $SHARED_DIR/.env $RELEASE_DIR/.env
            
            # Set permissions
            chown -R www-data:www-data $RELEASE_DIR
            chmod -R 755 $RELEASE_DIR
            
            # Run migrations
            cd $RELEASE_DIR
            php artisan migrate --force
            
            # Cache optimization
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            # Switch to new release
            ln -sfn $RELEASE_DIR $APP_DIR/current
            
            # Reload services
            sudo systemctl reload php8.2-fpm
            sudo supervisorctl restart togetherpay-worker:*
            
            # Keep only last 5 releases
            cd $APP_DIR/releases
            ls -t | tail -n +6 | xargs rm -rf
            
            # Cleanup
            rm /tmp/togetherpay-${{ github.sha }}.zip

      - name: Health Check
        run: |
          sleep 5
          curl -f https://api.togetherpay.app/up || exit 1

      - name: Notify Deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Production deployment ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  rollback:
    name: Rollback (Manual)
    runs-on: ubuntu-latest
    if: failure()
    environment:
      name: Production
    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/var/www/togetherpay"
            
            # Get previous release
            PREVIOUS=$(ls -t $APP_DIR/releases | sed -n '2p')
            
            if [ -z "$PREVIOUS" ]; then
              echo "No previous release found"
              exit 1
            fi
            
            # Switch back to previous release
            ln -sfn $APP_DIR/releases/$PREVIOUS $APP_DIR/current
            
            # Reload services
            sudo systemctl reload php8.2-fpm
            sudo supervisorctl restart togetherpay-worker:*
            
            echo "Rolled back to release: $PREVIOUS"
